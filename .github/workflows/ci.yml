name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fixture projection (independent implementation)
        run: node conformer.mjs
      - name: Registration parity against canonical spec artifacts
        run: node check-parity.mjs
